# Console over RTT
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# GPIO for power domain enables + button
CONFIG_GPIO=y

# Power management
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_POWER_DOMAIN=y
CONFIG_POWER_DOMAIN=y
CONFIG_POWER_DOMAIN_GPIO_INIT_PRIORITY=1
CONFIG_TIMEOUT_64BIT=y

# System-managed device PM (suspend peripherals before sleep)
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y

# PM policy — let the kernel pick the deepest idle state (STOP3)
CONFIG_PM_POLICY_DEFAULT=y
