# Console over RTT (STLink / OpenOCD)
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# GNSS — NMEA generic driver selects MODEM_BACKEND_UART which needs
# UART_INTERRUPT_DRIVEN and MODEM_MODULES (normally pulled in by UART_CONSOLE)
CONFIG_GNSS=y
CONFIG_GNSS_NMEA_GENERIC=y
CONFIG_GNSS_SATELLITES=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_MODEM_MODULES=y

# Display
CONFIG_DISPLAY=y
CONFIG_SPI=y
CONFIG_GPIO=y

# Display UI library (Sharp LS027B7DH01A)
CONFIG_DISPLAY_UI=y
CONFIG_DISPLAY_UI_FB_W=400
CONFIG_DISPLAY_UI_FB_H=240
CONFIG_DISPLAY_UI_PORTRAIT=y
CONFIG_DISPLAY_UI_ROWS=3

# Power domains (3V3 rail for GPS, 5V rail for display)
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_POWER_DOMAIN=y
CONFIG_TIMEOUT_64BIT=y
CONFIG_POWER_DOMAIN=y
CONFIG_POWER_DOMAIN_GPIO_INIT_PRIORITY=1
