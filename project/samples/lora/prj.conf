# Logging over USB CDC
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LORA_LOG_LEVEL_DBG=y
CONFIG_SPI_LOG_LEVEL_DBG=y

# LoRa (SX1262 driver auto-selected from DTS, but explicit for clarity)
CONFIG_LORA=y
CONFIG_LORA_SX126X=y
CONFIG_SPI=y
CONFIG_GPIO=y

# Console over USB CDC ACM
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Tracker LoRa"
CONFIG_USB_DEVICE_VID=0x2FE3
CONFIG_USB_DEVICE_PID=0x0005

# Power domains (3V3 rail for SX1262)
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_POWER_DOMAIN=y
CONFIG_TIMEOUT_64BIT=y
CONFIG_POWER_DOMAIN=y
CONFIG_POWER_DOMAIN_GPIO_INIT_PRIORITY=1

# Stack — LoRa driver needs extra headroom
CONFIG_MAIN_STACK_SIZE=4096
