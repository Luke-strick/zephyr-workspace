# ── Console (RTT via STLink) ──────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# ── Core peripherals ──────────────────────────────────────────────────────
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_DISPLAY=y

# ── Sensors ───────────────────────────────────────────────────────────────
CONFIG_LSM6DSO=y
CONFIG_LSM6DSO_TRIGGER_NONE=y
CONFIG_LIS3MDL=y
CONFIG_LIS3MDL_TRIGGER_NONE=y
CONFIG_LIS3MDL_ODR="20"

# ── GNSS ──────────────────────────────────────────────────────────────────
CONFIG_GNSS=y
CONFIG_GNSS_NMEA_GENERIC=y
CONFIG_MODEM_MODULES=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# ── LoRa ──────────────────────────────────────────────────────────────────
CONFIG_LORA=y
CONFIG_LORA_SX126X=y

# ── AHRS library ──────────────────────────────────────────────────────────
CONFIG_AHRS=y
CONFIG_AHRS_DT_MS=100
CONFIG_AHRS_ALPHA_X1000=960

# ── Display UI library ────────────────────────────────────────────────────
CONFIG_DISPLAY_UI=y
CONFIG_DISPLAY_UI_FB_W=400
CONFIG_DISPLAY_UI_FB_H=240
CONFIG_DISPLAY_UI_PORTRAIT=n
CONFIG_DISPLAY_UI_ROWS=1
CONFIG_DISPLAY_UI_MENU_TITLE_H=50
CONFIG_DISPLAY_UI_MENU_ITEM_MIN_H=60
CONFIG_DISPLAY_UI_MENU_BORDER_T=2
CONFIG_DISPLAY_UI_MENU_TEXT_SCALE=2

# ── Nav library ───────────────────────────────────────────────────────────
CONFIG_NAV=y
CONFIG_NAV_TACK_DEADBAND_DEG=15

# ── Non-volatile settings (NVS flash backend) ─────────────────────────────
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# ── Power domains ─────────────────────────────────────────────────────────
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_POWER_DOMAIN=y
CONFIG_POWER_DOMAIN=y
CONFIG_POWER_DOMAIN_GPIO_INIT_PRIORITY=1
CONFIG_TIMEOUT_64BIT=y

# ── FPU and float formatting ──────────────────────────────────────────────
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# ── Threading ─────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
